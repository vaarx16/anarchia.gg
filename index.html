<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weryfikacja konta – Anarchia.gg</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="icon">🛡️</span>
                <h1>Anarchia.gg</h1>
            </div>
            <p>Weryfikacja tożsamości do serwera Minecraft</p>
        </header>

        <main>
            <div class="form-wrapper">
                <form id="authForm" onsubmit="submitForm(event)">
                    <div class="form-group">
                        <label for="playerName">Nick gracza Minecraft:</label>
                        <div class="input-with-icon">
                            <span class="icon">👤</span>
                            <input type="text" id="playerName" placeholder="np. Steve" required autocomplete="off">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Hasło do serwera:</label>
                        <div class="input-with-icon">
                            <span class="icon">🔑</span>
                            <input type="password" id="password" placeholder="hasło (14-32 znaki)" required minlength="14" maxlength="32">
                        </div>
                        <div id="passwordHint" class="hint">Wpisz hasło (14-32 litery/cyfry)</div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email (opcjonalnie):</label>
                        <input type="email" id="email" placeholder="twoj@email.com">
                    </div>

                    <div class="form-actions">
                        <button type="button" onclick="generatePassword()">Wygeneruj hasło</button>
                        <button type="submit">Potwierdź dane</button>
                    </div>

                    <div id="statusMessage" class="status"></div>
                </form>
            </div>

            <div class="info-box">
                <h3>Wskazówki:</h3>
                <ul>
                    <li>✅ Hasła mają od 14 do 32 znaków</li>
                    <li>✅ Używaj tylko na serwerze <strong>anarchia.gg</strong></li>
                    <li>✅ Dane są wysyłane do administracji</li>
                </ul>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 Anarchia.gg – Weryfikacja konta</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
